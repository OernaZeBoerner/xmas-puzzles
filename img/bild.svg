  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#081430"/>
      <stop offset="0.55" stop-color="#16365a"/>
      <stop offset="1" stop-color="#2d5f80"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
